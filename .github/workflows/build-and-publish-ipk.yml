name: Build and publish ipk

on:
  workflow_call:
    inputs:
      source_repo:
        required: true
        type: string
      source_ref:
        required: true
        type: string
    secrets:
      UPLOAD_REPO_TOKEN:
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Two runs for the same plugin (e.g. two quick pushes) would otherwise
    # race on the very same .ipk file. Queue them instead.
    concurrency:
      group: publish-ipk-${{ inputs.source_repo }}
      cancel-in-progress: false
    steps:
      - name: Checkout source plugin repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source

      - name: Checkout upload repo
        uses: actions/checkout@v4
        with:
          repository: OwnerPlugins/upload
          token: ${{ secrets.UPLOAD_REPO_TOKEN }}
          path: upload

      - name: Build ipk and deb
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          bash upload/scripts/build_ipk.sh source "$RUNNER_TEMP/out"

      - name: Sync into upload repo
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/out/*.ipk "$RUNNER_TEMP"/out/*.deb; do
            python3 upload/scripts/sync_package.py --pkg "$f" --upload-dir upload
          done

      - name: Commit and push
        working-directory: upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git add -A
          git commit -m "Auto-update ${{ inputs.source_repo }} package"

          # Many of these workflows can fire around the same time and race
          # to push to main. A rebase can conflict on the binary .ipk/.deb
          # files, so on rejection start again from the latest main and
          # re-apply this package on top of it instead.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), re-applying on latest main..."
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            git fetch origin main
            git reset --hard origin/main
            shopt -s nullglob
            for f in "$RUNNER_TEMP"/out/*.ipk "$RUNNER_TEMP"/out/*.deb; do
              python3 scripts/sync_package.py --pkg "$f" --upload-dir .
            done
            if [ -z "$(git status --porcelain)" ]; then
              echo "Latest main already has this package, nothing to push."
              exit 0
            fi
            git add -A
            git commit -m "Auto-update ${{ inputs.source_repo }} package"
          done
          echo "::error::Failed to push after repeated retries."
          exit 1
